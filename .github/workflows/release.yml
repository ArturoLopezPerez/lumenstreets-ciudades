# Publica las zonas como archivos de la release `zonas-v1` (sin claves: usa el GITHUB_TOKEN de Actions).
name: Publicar release de zonas
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la release (zonas-vN)
        default: zonas-v2
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Crear la release y subir las zonas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" --title "Zonas de Fráncfort ${{ inputs.tag }}" --notes "310 zonas de 1 km en tres niveles de detalle (cerca, medio y la capa lejana de toda la ciudad), formato LMQ2, e índice zonas.json. Datos: HVBG LoD2/DGM1 (dl-de/by-2-0) y OpenStreetMap (ODbL), modificados. Ver README." || true
          ls zonas | sort | split -l 60 - lote_
          for l in lote_*; do xargs -a "$l" -I{} echo "zonas/{}" | xargs gh release upload "${{ inputs.tag }}" --clobber; done
